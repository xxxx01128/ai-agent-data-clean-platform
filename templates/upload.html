<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数据上传与自动清洗</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(1200px 600px at 50% 0%, #162447 0%, #0b1328 60%);
            min-height: 100vh; color: #fff; font-family: "Microsoft Yahei", sans-serif;
            display: flex; flex-direction: column; align-items: center; padding: 40px 20px;
        }
        h1 { font-size: 30px; margin-bottom: 6px; letter-spacing: 2px; }
        .sub { color: #7d8db8; margin-bottom: 28px; }
        .back { color: #4a7bff; text-decoration: none; font-size: 14px; position: absolute; top: 24px; left: 28px; }
        .back:hover { text-decoration: underline; }

        .drop-zone {
            width: 640px; max-width: 92vw; height: 220px;
            border: 2px dashed #3a5390; border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: .25s; background: rgba(22,36,71,.5);
        }
        .drop-zone:hover, .drop-zone.dragover { border-color: #4a7bff; background: rgba(38,60,120,.45); }
        .drop-zone .icon { font-size: 44px; margin-bottom: 10px; }
        .drop-zone .tip { font-size: 16px; color: #b9c7e8; }
        .drop-zone .hint { font-size: 12px; color: #6f7fa8; margin-top: 8px; }

        .tables { margin-top: 26px; width: 640px; max-width: 92vw; }
        .tables h3 { font-size: 15px; color: #9fb2d9; margin-bottom: 10px; font-weight: normal; }
        .tbl-row {
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(160deg, #162447, #1b2c5a);
            border: 1px solid #2b4075; border-radius: 8px;
            padding: 9px 16px; margin-bottom: 7px; font-size: 13px;
        }
        .tbl-row .n { color: #dfe7fa; }
        .tbl-row .m { color: #7d8db8; }

        .result { width: 1000px; max-width: 95vw; margin-top: 30px; display: none; }
        .result.show { display: block; }
        .result .ok-box {
            background: linear-gradient(160deg, #12351f, #1b2c5a);
            border: 1px solid #2f7d46; border-radius: 12px;
            padding: 16px 22px; margin-bottom: 18px; font-size: 15px;
        }
        .result .ok-box .t { color: #6fe08a; font-weight: bold; margin-bottom: 6px; }
        .result .ok-box .steps { color: #b9c7e8; font-size: 13px; line-height: 1.9; }
        .result .ok-box .steps li { margin-left: 18px; }
        .file-block {
            background: linear-gradient(160deg, #101b38, #16244a);
            border: 1px solid #2b4075; border-radius: 12px;
            padding: 16px 18px; margin-bottom: 18px;
        }
        .file-block .file-title {
            font-size: 15px; color: #6fa8ff; font-weight: bold; margin-bottom: 10px;
        }
        .file-block .steps { color: #b9c7e8; font-size: 13px; line-height: 1.9; margin: 0 0 12px; }
        .file-block .steps li { margin-left: 18px; }
        .file-block .preview-wrap { border: none; background: transparent; padding: 0; }
        .file-block .preview-wrap h3 { color: #9fb2d9; }
        .result .err-box {
            background: linear-gradient(160deg, #3a1520, #1b2c5a);
            border: 1px solid #a04353; border-radius: 12px;
            padding: 16px 22px; margin-bottom: 18px; font-size: 14px; color: #f0b6c0;
        }
        .stats { display: flex; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
        .stat {
            flex: 1; min-width: 140px; background: linear-gradient(160deg, #162447, #1b2c5a);
            border: 1px solid #2b4075; border-radius: 10px; padding: 14px 18px; text-align: center;
        }
        .stat .v { font-size: 24px; font-weight: bold; color: #6fa8ff; }
        .stat .k { font-size: 12px; color: #8fa3cf; margin-top: 4px; }

        .preview-wrap {
            background: linear-gradient(160deg, #101b38, #16244a);
            border: 1px solid #2b4075; border-radius: 12px; padding: 16px;
            overflow-x: auto;
        }
        .preview-wrap h3 { font-size: 15px; color: #9fb2d9; margin-bottom: 12px; font-weight: normal; }
        table.preview { border-collapse: collapse; width: 100%; font-size: 12.5px; white-space: nowrap; }
        table.preview th {
            background: #223a6e; color: #cfe0ff; padding: 8px 12px;
            border: 1px solid #33497e; position: sticky; top: 0; text-align: left;
        }
        table.preview td { padding: 7px 12px; border: 1px solid #26355c; color: #d7e1f7; }
        table.preview tr:hover td { background: rgba(74,123,255,.12); }

        .links { margin-top: 26px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
        .links a {
            color: #4a7bff; text-decoration: none; font-size: 14px;
            border: 1px solid #2b4075; border-radius: 8px; padding: 8px 18px;
            background: rgba(22,36,71,.6); transition: .2s;
        }
        .links a:hover { border-color: #4a7bff; background: rgba(38,60,120,.5); }
    </style>
</head>
<body>
    <a class="back" href="/">← 返回导航</a>
    <h1>📤 数据上传与自动清洗</h1>
    <div class="sub">上传 CSV / Excel → 自动识别表类型 → 自动清洗 → 看板数据实时更新</div>

    <div class="drop-zone" id="dropZone">
        <div class="icon">📂</div>
        <div class="tip">点击选择 或 拖拽文件到此处上传（支持一次多个文件）</div>
        <div class="hint">支持 CSV / XLS / XLSX，文件名需包含：Dim_Branch、Dim_Customer、Dim_FinProduct、Fact_Application、Fact_Transaction</div>
        <input type="file" id="fileInput" accept=".csv,.xls,.xlsx" multiple hidden>
    </div>

    <div class="tables">
        <h3>当前数据表状态</h3>
        <div id="tableList">加载中…</div>
        <div class="tbl-row" style="margin-top:8px;border-top:1px dashed #2b4075;padding-top:8px">
            <span class="n">数据版本</span>
            <span class="m" id="dataVersion">-</span>
        </div>
        <div class="hint" style="margin-top:8px">
            上传清洗完成后，风控页与营销页的「AI 分析」会自动按新数据重新生成报告。
        </div>
    </div>

    <div class="result" id="result"></div>

    <div class="links">
        <a href="/risk">🔒 智能风控</a>
        <a href="/marketing">👥 精准营销</a>
        <a href="/business">📈 经营突破</a>
    </div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const resultBox = document.getElementById('result');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => {
    if (fileInput.files.length) uploadFiles(fileInput.files);
    fileInput.value = '';
});

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let lastUploadVersion = null;

function loadTables() {
    fetch('/api/tables').then(r => r.json()).then(res => {
        const list = res.tables || res;
        document.getElementById('tableList').innerHTML = list.map(t => `
            <div class="tbl-row">
                <span class="n">${esc(t.name)}</span>
                <span class="m">${t.exists ? esc(t.rows) + ' 行 · 更新于 ' + esc(t.updated) : '⚠ 尚无数据'}</span>
            </div>`).join('');
        const verEl = document.getElementById('dataVersion');
        if (verEl && res.version) {
            verEl.textContent = lastUploadVersion ? `${lastUploadVersion} → ${res.version}` : res.version;
        }
    }).catch(() => {
        document.getElementById('tableList').innerHTML = '<div class="tbl-row"><span class="m">加载失败，请刷新重试</span></div>';
    });
}

function uploadOne(file) {
    const fd = new FormData();
    fd.append('file', file);
    return fetch('/api/upload', { method: 'POST', body: fd })
        .then(async r => {
            const data = await r.json();
            if (!data.ok) throw new Error(data.msg || '上传失败');
            return { ok: true, name: file.name, data };
        })
        .catch(err => ({ ok: false, name: file.name, msg: err.message }));
}

async function uploadFiles(fileList) {
    const files = Array.from(fileList);
    resultBox.classList.add('show');
    // 进度提示
    resultBox.innerHTML = `<div class="ok-box"><div class="t">⏳ 正在上传并清洗（0 / ${files.length}）…</div></div>`;

    const results = [];
    for (let i = 0; i < files.length; i++) {
        resultBox.querySelector('.t').textContent = `⏳ 正在上传并清洗（${i} / ${files.length}）… ${esc(files[i].name)}`;
        results.push(await uploadOne(files[i]));
    }
    renderResults(results);
    const lastOk = results.filter(r => r.ok).pop();
    if (lastOk && lastOk.data.data_version) lastUploadVersion = lastOk.data.data_version;
    loadTables();
}

function renderResults(results) {
    const okList = results.filter(r => r.ok);
    const errList = results.filter(r => !r.ok);

    let html = '';
    if (okList.length) {
        html += `<div class="ok-box"><div class="t">✅ 成功处理 ${okList.length} 个文件，看板数据已自动更新</div></div>`;
        for (const r of okList) {
            const d = r.data;
            html += `
            <div class="file-block">
                <div class="file-title">📄 ${esc(r.name)} → ${esc(d.table)}</div>
                <ul class="steps">${d.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ul>
                <div class="stats">
                    <div class="stat"><div class="v">${d.raw_rows}</div><div class="k">上传原始行数</div></div>
                    <div class="stat"><div class="v">${d.clean_rows}</div><div class="k">清洗后行数</div></div>
                </div>
                <div class="preview-wrap">
                    <h3>清洗后数据预览（前 ${d.preview.length} 行）</h3>
                    <table class="preview">
                        <thead><tr>${d.columns.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
                        <tbody>${d.preview.map(row =>
                            '<tr>' + d.columns.map(c => `<td>${esc(row[c] !== undefined ? row[c] : '')}</td>`).join('') + '</tr>'
                        ).join('')}</tbody>
                    </table>
                </div>
            </div>`;
        }
    }
    for (const r of errList) {
        html += `<div class="err-box">❌ ${esc(r.name)}：${esc(r.msg)}</div>`;
    }
    resultBox.innerHTML = html;
}

loadTables();
</script>
</body>
</html>
